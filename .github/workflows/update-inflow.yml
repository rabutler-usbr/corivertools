name: Update water-year inflow

# Two ways to trigger this:
#
# 1) MANUAL (works today, no setup needed): go to the "Actions" tab on GitHub,
#    select "Update water-year inflow" in the left sidebar, click "Run workflow",
#    and type in the new acre-feet value for the water year you want to update
#    (almost always the current/open water year, e.g. 2026). This commits the
#    change straight to the branch you choose, which redeploys the GitHub Pages
#    site automatically.
#
# 2) SCHEDULED (disabled by default -- see the commented-out `schedule:` block
#    below). Once you know exactly where your monthly forecast number comes
#    from (e.g. a specific Reclamation 24-Month Study PDF/page, a CBRFC
#    forecast page, an internal API, etc.), you can:
#      a. Write a small fetch/parse step that pulls the number from that source
#         (a Python script using `requests`/`pdfplumber`/etc., or a curl + jq
#         one-liner -- whatever fits the source format), and
#      b. Pipe the resulting value into `scripts/update_inflow.py` the same way
#         the manual job below does.
#    Until that source is decided, this file only wires up the manual path so
#    nothing runs unattended against made-up data.

on:
  workflow_dispatch:
    inputs:
      water_year:
        description: "Water year to update (e.g. 2026)"
        required: true
        default: "2026"
      acre_feet:
        description: "New unregulated inflow value, in acre-feet (e.g. 4500000)"
        required: true
      source_url:
        description: "Optional: URL of the forecast/source you used (leave blank to skip)"
        required: false
        default: ""

  # --- TODO: enable once you've picked a forecast source and written the fetch step ---
  # schedule:
  #   - cron: "0 15 5 * *"  # 5th of each month, 15:00 UTC -- adjust to your forecast's release schedule

permissions:
  contents: write

jobs:
  update-inflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --- TODO: for the scheduled path, add a step here that fetches the new
      # value from your real forecast source and sets it as $ACRE_FEET, e.g.:
      #
      # - name: Fetch latest forecast
      #   id: forecast
      #   run: |
      #     value=$(python3 scripts/fetch_forecast.py)   # you would write this script
      #     echo "acre_feet=$value" >> "$GITHUB_OUTPUT"
      #
      # then reference steps.forecast.outputs.acre_feet below instead of
      # github.event.inputs.acre_feet.

      - name: Update historical_inflow.json
        run: |
          python3 scripts/update_inflow.py \
            --year "${{ github.event.inputs.water_year }}" \
            --acre-feet "${{ github.event.inputs.acre_feet }}" \
            ${{ github.event.inputs.source_url != '' && format('--source "{0}"', github.event.inputs.source_url) || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/historical_inflow.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add data/historical_inflow.json
          git commit -m "Update WY${{ github.event.inputs.water_year }} inflow to ${{ github.event.inputs.acre_feet }} AF"
          git push
