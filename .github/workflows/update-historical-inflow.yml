name: Update historical inflow from HDB

on:
  push:
    branches:
      - main
    paths:
      - "data/mrids.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-historical-inflow:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "remotes"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("BoulderCodeHub/rhdb")'

      - name: Refresh recent water-year inflow data
        run: Rscript scripts/update_historical_inflow.R --mrids data/mrids.csv

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/historical_inflow.json; then
            echo "No historical inflow changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical_inflow.json
          git commit -m "Update historical inflow from HDB"
          git push
